name: bump-tap

# Runs after a GitHub release is published: computes the new tarball's sha256
# and opens the formula bump in devcodes9/homebrew-tap, so a release is one
# `git push --tags` rather than a manual sha256 copy-paste.
#
# Requires a HOMEBREW_TAP_TOKEN secret — a PAT with `contents: write` on the
# tap repo. Until that exists the job is skipped, not failed, so cutting a
# release never blocks on tap plumbing.

# Triggered by the tag, not by `release: published`. A release created by the
# release workflow is created with GITHUB_TOKEN, and GitHub does not start
# workflows from GITHUB_TOKEN events, so the published-release trigger never
# fired. v0.2.0 shipped with the tap still on 0.1.1 because of it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to bump the formula to (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the tap token
        id: gate
        run: |
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN is not set — skipping the tap bump."
            echo "::notice::See docs/packaging/homebrew.md to finish tap setup."
          fi

      # Done with `gh api` rather than a bump action. The action failed with an
      # opaque "unexpected HTTP 303": it falls back to fork-and-PR when it cannot
      # detect push access, and a fine-grained PAT does not report permissions the
      # way it expects, so it tried to fork a repo the token already owns. The
      # operation is three steps, and doing them here means the next failure names
      # itself.
      - name: Bump the formula
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          TAP: devcodes9/homebrew-tap
          FORMULA: Formula/agsearch.rb
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          sha="$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)"
          echo "tag=$TAG sha256=$sha"

          gh api "repos/$TAP/contents/$FORMULA" --jq .content | base64 -d > formula.rb
          blob="$(gh api "repos/$TAP/contents/$FORMULA" --jq .sha)"

          sed -i "s|url \"[^\"]*\"|url \"$url\"|" formula.rb
          sed -i "s|sha256 \"[0-9a-f]\{64\}\"|sha256 \"$sha\"|" formula.rb
          grep -q "$url" formula.rb || { echo "url substitution failed"; exit 1; }
          grep -q "$sha" formula.rb || { echo "sha256 substitution failed"; exit 1; }

          gh api -X PUT "repos/$TAP/contents/$FORMULA" \
            -f message="agsearch ${TAG#v}" \
            -f content="$(base64 -w0 formula.rb)" \
            -f sha="$blob" >/dev/null
          echo "bumped $TAP to $TAG"
